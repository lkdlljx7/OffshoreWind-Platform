name: ${COMPOSE_PROJECT_NAME:-replace-with-artifact-id-demo}

services:
  database:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-offshorewind_demo}
      POSTGRES_USER: ${POSTGRES_USER:-demo_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_demo_password}
    ports:
      - "${DATABASE_PORT:-54329}:5432"
    volumes:
      - demo-database:/var/lib/postgresql/data
      - ./database/migrations/001-create-schema.sql:/docker-entrypoint-initdb.d/001-create-schema.sql:ro
      - ./database/seed/001-seed-demo.sql:/docker-entrypoint-initdb.d/002-seed-demo.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-demo_user} -d ${POSTGRES_DB:-offshorewind_demo}"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    image: node:20.18.1-alpine
    working_dir: /app
    command: ["node", "src/server.js"]
    environment:
      PORT: 3101
      DATABASE_HOST: database
      DATABASE_NAME: ${POSTGRES_DB:-offshorewind_demo}
    ports:
      - "${BACKEND_PORT:-3101}:3101"
    volumes:
      - ./backend:/app:ro
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3101/api/health"]
      interval: 3s
      timeout: 3s
      retries: 20

  frontend:
    image: nginx:1.27.3-alpine
    ports:
      - "${FRONTEND_PORT:-3100}:80"
    volumes:
      - ./frontend/public:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  demo-database:
