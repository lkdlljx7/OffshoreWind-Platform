name: Validate metadata

on:
  pull_request:
    paths:
      - "deliverables/**"
      - "product/**"
      - "governance/artifact.schema.json"
      - "governance/scripts/validate_artifacts.rb"
      - ".github/workflows/validate-metadata.yml"
  push:
    branches: [main]
    paths:
      - "deliverables/**"
      - "product/**"
      - "governance/artifact.schema.json"
      - "governance/scripts/validate_artifacts.rb"
      - ".github/workflows/validate-metadata.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate artifact metadata
        run: ruby governance/scripts/validate_artifacts.rb --metadata-only
