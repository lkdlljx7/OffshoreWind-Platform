name: Demo 缺陷
description: 报告可运行 Demo 的功能或运行问题
title: "[缺陷] "
labels:
  - defect
body:
  - type: input
    id: deliverable
    attributes:
      label: Demo 成果标识
      placeholder: progress-management
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Demo 版本
      placeholder: 0.4.0
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 运行环境与日志
      description: 请先删除账号、令牌和其他敏感信息。
