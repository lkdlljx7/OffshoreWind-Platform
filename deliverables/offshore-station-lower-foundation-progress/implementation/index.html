<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1440" />
  <title>海上换流站下部基础建造进度管理 · Demo</title>
  <style>
    /* ============== 设计令牌 ============== */
    :root {
      --brand-50:  #eaf3ff;
      --brand-100: #d6e7ff;
      --brand-200: #b6d3ff;
      --brand-300: #82b4ff;
      --brand-400: #4d92ff;
      --brand-500: #1f6feb;   /* 主蓝 */
      --brand-600: #195fc7;
      --brand-700: #134ba0;
      --brand-800: #0d3678;
      --ink-1:  #1f2a44;   /* 主文字 */
      --ink-2:  #4b5876;   /* 次文字 */
      --ink-3:  #8693ad;   /* 弱化文字 */
      --line-1: #e6ebf5;   /* 描边 */
      --line-2: #eef2fa;
      --bg-app: #f4f7fc;   /* 页面底色 */
      --bg-card:#ffffff;
      --bg-tag-soft:#eef4ff;
      --green-500:#16a34a;
      --green-50:#eafaf0;
      --amber-500:#d97706;
      --amber-50:#fff5e0;
      --red-500:#dc2626;
      --red-50:#ffeaea;
      --gray-chip:#f1f4fb;
      --shadow-1: 0 1px 2px rgba(20,40,90,.04), 0 4px 12px rgba(20,40,90,.04);
      --radius-sm: 4px;
      --radius-md: 8px;
      --radius-lg: 12px;
      --table-inline-space: 18px;
      --modal-width: 720px;
      --modal-height: 716px;
      --form-column-gap: 24px;
      --form-row-space: 16px;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: "PingFang SC", "Microsoft YaHei", "Source Han Sans SC", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: var(--ink-1);
      background: var(--bg-app);
      font-size: 13px;
      min-width: 1440px;
    }
    a { color: var(--brand-500); text-decoration: none; }
    a:hover { color: var(--brand-700); }
    button { font-family: inherit; cursor: pointer; }

    /* ============== 总体布局 ============== */
    .app {
      display: grid;
      grid-template-columns: 220px 1fr;
      min-height: 100vh;
    }
    .main { display: flex; flex-direction: column; min-width: 0; }
    .content { padding: 16px 20px 24px; flex: 1; }

    /* ============== 侧栏 ============== */
    .sidebar {
      background: linear-gradient(180deg, #1957c4 0%, #0f3e96 100%);
      color: #e7efff;
      padding: 18px 0 24px;
      position: sticky; top: 0; height: 100vh;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,.22) transparent;
    }
    .brand {
      display: flex; flex-direction: column; align-items: center;
      padding: 4px 16px 16px;
      text-align: center;
    }
    .brand .logo {
      width: 44px; height: 44px; border-radius: 12px;
      background: rgba(255,255,255,.12);
      display: grid; place-items: center;
      margin-bottom: 10px;
    }
    .brand .logo svg { width: 26px; height: 26px; }
    .brand .name { font-size: 14px; font-weight: 600; letter-spacing: 1px; }
    .side-group { padding: 8px 12px; }
    .side-item {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 12px; border-radius: 6px;
      font-size: 13px; color: #c8d8ff;
      cursor: pointer; user-select: none;
    }
    .side-item:hover { background: rgba(255,255,255,.06); color: #fff; }
    .side-item.active {
      background: rgba(255,255,255,.16);
      color: #fff;
    }
    .side-item > span:first-of-type {
      max-width: 9em;
      overflow-wrap: anywhere;
    }
    .side-item .ico { width: 16px; height: 16px; flex: 0 0 16px; opacity: .9; }
    .side-caret { margin-left: auto; opacity: .6; font-size: 10px; }
    .side-item.fake { color: #d5e1ff; }
    .side-item.fake .side-caret { font-size: 14px; line-height: 1; }

    /* ============== 顶栏 ============== */
    .topbar {
      display: flex; align-items: center; gap: 14px;
      padding: 10px 20px;
      background: #fff;
      border-bottom: 1px solid var(--line-1);
    }
    .topbar .collapse { color: var(--ink-2); display: flex; align-items: center; gap: 6px; cursor: pointer; }
    .crumb { color: var(--ink-2); }
    .crumb .sep { margin: 0 8px; color: var(--ink-3); }
    .crumb .cur { color: var(--brand-500); font-weight: 600; }
    .topbar .right { margin-left: auto; display: flex; align-items: center; gap: 12px; color: var(--ink-2); }
    .pill {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 2px 10px; border-radius: 999px;
      font-size: 12px;
    }
    .pill.ok { background: #e8f7ee; color: #1b8c4a; }
    .pill .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .avatar {
      width: 26px; height: 26px; border-radius: 50%;
      background: linear-gradient(135deg, #4d92ff, #1f6feb);
      color: #fff; display: grid; place-items: center; font-size: 12px; font-weight: 600;
    }

    /* ============== 页签 ============== */
    .tabs {
      display: flex; align-items: center; gap: 4px;
      background: #fff;
      padding: 0 16px;
      border-bottom: 1px solid var(--line-1);
    }
    .tab {
      position: relative;
      padding: 12px 16px;
      font-size: 14px;
      color: var(--ink-2);
      cursor: pointer;
      user-select: none;
    }
    .tab:hover { color: var(--brand-500); }
    .tab.active { color: var(--brand-500); font-weight: 600; }
    .tab.active::after {
      content: ""; position: absolute; left: 12px; right: 12px; bottom: -1px;
      height: 2px; background: var(--brand-500); border-radius: 2px;
    }

    /* ============== 卡片 ============== */
    .card {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-1);
      border: 1px solid var(--line-1);
    }
    .card-head {
      display: flex; align-items: center;
      padding: 14px 18px;
      border-bottom: 1px solid var(--line-2);
    }
    .card-title { display: flex; align-items: center; gap: 8px; font-weight: 600; }
    .card-title .dot {
      width: 14px; height: 14px; border-radius: 50%;
      background: linear-gradient(135deg, #4d92ff, #1f6feb);
      display: inline-grid; place-items: center; color: #fff; font-size: 9px;
    }
    .card-title .dot::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #fff; }
    .card-body { padding: 16px 18px 20px; }
    .card-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }

    /* ============== 指标条 ============== */
    .kpis { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 14px; }
    .kpi {
      background: #fff; border: 1px solid var(--line-1); border-radius: var(--radius-md);
      padding: 14px 16px;
      display: flex; align-items: center; gap: 12px;
    }
    .kpi .ico {
      width: 36px; height: 36px; border-radius: 8px;
      background: var(--bg-tag-soft); color: var(--brand-500);
      display: grid; place-items: center;
    }
    .kpi .label { color: var(--ink-2); font-size: 12px; }
    .kpi .val { font-size: 22px; font-weight: 600; color: var(--ink-1); }
    .kpi .sub { color: var(--ink-3); font-size: 12px; }

    /* ============== 筛选 ============== */
    .filters {
      display: flex; flex-wrap: wrap; align-items: center; gap: 14px;
      padding: 14px 18px;
    }
    .list-card > .filters { border-bottom: 1px solid var(--line-2); }
    .list-card > .card-head { min-height: 58px; }
    .field { display: flex; align-items: center; gap: 8px; }
    .field label { color: var(--ink-2); font-size: 12px; }
    .field .ctl {
      height: 30px; min-width: 160px; padding: 0 10px;
      background: #fff; border: 1px solid var(--line-1); border-radius: 4px;
      color: var(--ink-1);
    }
    .field .ctl.short { min-width: 110px; }
    .field .ctl::placeholder { color: var(--ink-3); }

    /* ============== 按钮 ============== */
    .btn {
      height: 30px; padding: 0 14px; border-radius: 4px;
      display: inline-flex; align-items: center; gap: 6px;
      border: 1px solid var(--line-1); background: #fff; color: var(--ink-1);
      font-size: 12px;
    }
    .btn:hover { color: var(--brand-500); border-color: var(--brand-300); }
    .btn.primary { background: var(--brand-500); border-color: var(--brand-500); color: #fff; }
    .btn.primary:hover { background: var(--brand-600); border-color: var(--brand-600); color: #fff; }
    .btn.ghost { background: transparent; border-color: var(--brand-500); color: var(--brand-500); }
    .btn.ghost:hover { background: var(--bg-tag-soft); }
    .btn .plus { width: 12px; height: 12px; }

    /* ============== 表格 ============== */
    .table-wrap {
      overflow: auto;
      margin: 0 var(--table-inline-space);
      border: 1px solid var(--line-2);
      border-radius: 6px;
      background: #fff;
    }
    table.t {
      width: 100%; border-collapse: separate; border-spacing: 0;
      font-size: 12.5px;
    }
    table.t thead th {
      position: sticky; top: 0; z-index: 1;
      background: #f3f7ff; color: var(--ink-2); font-weight: 500;
      height: 42px; padding: 0 12px; text-align: center;
      border-bottom: 1px solid var(--line-1);
      white-space: nowrap; vertical-align: middle;
    }
    table.t tbody td {
      height: 42px; padding: 0 12px; border-bottom: 1px solid var(--line-2);
      color: var(--ink-1); white-space: nowrap;
      text-align: center; vertical-align: middle;
    }
    table.t thead th:first-child,
    table.t tbody td:first-child { padding-left: 16px; }
    table.t thead th:last-child,
    table.t tbody td:last-child { padding-right: 16px; }
    table.t tbody tr:last-child td { border-bottom: 0; }
    table.t tbody td.cb-cell,
    table.t thead th:first-child { text-align: center; }
    table.t tbody td.num { text-align: center; font-variant-numeric: tabular-nums; }
    /* 表头数字列与数据列统一居中 */
    table.t thead th.num { text-align: center; }
    table.t tbody td.ctr { text-align: center; white-space: nowrap; }
    table.t .ctr a + a { margin-left: 8px; }
    table.t tbody td.ctr a { display: inline-block; }
    table.t .op-group { display: inline-flex; align-items: center; justify-content: center; }
    table.t tbody tr:hover td { background: #f7faff; }
    table.t .danger { color: var(--red-500); }
    /* 宽表固定序号和名称列，横向滚动时仍可识别当前记录。 */
    table.t thead th:nth-child(1),
    table.t tbody td:nth-child(1):not(.empty-cell) {
      position: sticky; left: 0; width: 52px; min-width: 52px; max-width: 52px;
      z-index: 2; background: #fff;
    }
    table.t thead th:nth-child(2),
    table.t tbody td:nth-child(2) {
      position: sticky; left: 52px; min-width: 140px;
      z-index: 2; background: #fff;
      box-shadow: 1px 0 0 var(--line-1);
    }
    table.t thead th:nth-child(1),
    table.t thead th:nth-child(2) { z-index: 4; background: #f3f7ff; }
    table.t tbody tr:hover td:nth-child(1):not(.empty-cell),
    table.t tbody tr:hover td:nth-child(2) { background: #f7faff; }
    table.t .empty-cell {
      position: static; width: auto; min-width: 0; max-width: none;
      height: 120px; color: var(--ink-3);
    }

    /* 复选框 */
    .cb { width: 14px; height: 14px; }

    /* 状态 */
    .status {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 2px 8px; border-radius: 999px;
      font-size: 12px;
    }
    .status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .status.gray   { color: var(--ink-2); background: var(--gray-chip); }
    .status.blue   { color: var(--brand-600); background: var(--bg-tag-soft); }
    .status.green  { color: var(--green-500); background: var(--green-50); }
    .status.amber  { color: var(--amber-500); background: var(--amber-50); }
    .status.red    { color: var(--red-500);   background: var(--red-50); }

    /* 进度条 */
    .bar { display: flex; align-items: center; gap: 8px; width: 150px; min-width: 150px; margin: 0 auto; }
    .bar .track {
      position: relative; height: 6px; flex: 1; background: #eef2fa; border-radius: 999px; overflow: hidden;
    }
    .bar .fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--brand-500); border-radius: 999px; }
    .bar .fill.green { background: var(--green-500); }
    .bar .fill.amber { background: var(--amber-500); }
    .bar .num { width: 38px; text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-2); }

    /* 重点关注标签 */
    .star { color: #f59e0b; }

    /* 分页 */
    .pager {
      display: flex; align-items: center; gap: 10px; padding: 10px 18px;
      color: var(--ink-2); font-size: 12px;
    }
    .pager .right { margin-left: auto; display: flex; align-items: center; gap: 6px; }
    .page {
      min-width: 26px; height: 26px; padding: 0 8px; border-radius: 4px;
      display: inline-grid; place-items: center; cursor: pointer;
      background: #fff; border: 1px solid var(--line-1); color: var(--ink-2);
    }
    .page.cur { background: var(--brand-500); border-color: var(--brand-500); color: #fff; }
    .page:hover { color: var(--brand-500); border-color: var(--brand-300); }
    .page.cur:hover { color: #fff; }
    .page:disabled { cursor: not-allowed; opacity: .45; color: var(--ink-3); border-color: var(--line-1); }

    /* 摘要视图（总览用） */
    .summary-grid { display: grid; grid-template-columns: 1.2fr 1fr; gap: 14px; }
    .summary-grid .left, .summary-grid .right { display: flex; flex-direction: column; gap: 14px; }
    .ring {
      display: flex; align-items: center; gap: 18px;
    }
    .ring svg { width: 130px; height: 130px; }
    .ring .legend { display: grid; gap: 6px; font-size: 12px; color: var(--ink-2); }
    .ring .legend .li { display: flex; align-items: center; gap: 8px; }
    .ring .legend .sw { width: 10px; height: 10px; border-radius: 2px; }

    .today-list { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px 18px; }
    .today-list .li { display: flex; align-items: center; gap: 8px; font-size: 12.5px; }
    .today-list .li .name { color: var(--ink-2); flex: 1; min-width: 0;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .today-list .li .pct { color: var(--brand-500); font-weight: 600; min-width: 40px; text-align: right; }

    .stack-list { display: grid; gap: 8px; }
    .stack-list .row { display: flex; align-items: center; gap: 10px; font-size: 12.5px; }
    .stack-list .row .label { width: 64px; color: var(--ink-2); }
    .stack-list .row .track { flex: 1; height: 8px; background: #eef2fa; border-radius: 999px; position: relative; overflow: hidden; }
    .stack-list .row .fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--brand-500); border-radius: 999px; }
    .stack-list .row .pct { width: 44px; text-align: right; color: var(--ink-1); font-variant-numeric: tabular-nums; }

    .overview-grid {
      display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }
    .overview-card {
      height: 360px; min-width: 0; min-height: 0; overflow: hidden;
      display: flex; flex-direction: column;
    }
    .overview-card > .card-head { flex: 0 0 auto; }
    .overview-card > .card-body {
      flex: 1 1 auto; min-height: 0; overflow: auto;
      scrollbar-gutter: stable;
    }

    /* 弹窗（新增/编辑） */
    .modal-mask { position: fixed; inset: 0; background: rgba(20,40,90,.32); z-index: 60; opacity: 0; pointer-events: none; transition: opacity .2s; }
    .modal-mask.show { opacity: 1; pointer-events: auto; }
    .modal {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -46%) scale(.96);
      width: var(--modal-width); height: var(--modal-height);
      max-width: calc(100vw - 48px); max-height: calc(100vh - 4px);
      background: #fff; border-radius: 12px; box-shadow: 0 20px 60px rgba(20,40,90,.25);
      z-index: 70; opacity: 0; pointer-events: none; transition: opacity .15s, transform .15s;
      display: flex; flex-direction: column;
    }
    .modal.show { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%) scale(1); }
    .modal-head {
      min-height: 52px; padding: 0 24px; border-bottom: 1px solid var(--line-1);
      display: flex; align-items: center; gap: 8px;
      flex: 0 0 52px;
    }
    .modal-head .title { font-weight: 600; }
    .modal-head .close { margin-left: auto; cursor: pointer; color: var(--ink-3); }
    .modal-body {
      padding: 20px 24px;
      flex: 1 1 auto; min-height: 0;
      overflow: auto; scrollbar-gutter: stable;
    }
    .modal-foot {
      min-height: 56px; padding: 0 24px; border-top: 1px solid var(--line-1);
      display: flex; justify-content: flex-end; gap: 8px;
      align-items: center; flex: 0 0 56px;
    }
    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      column-gap: var(--form-column-gap); row-gap: 0;
      align-content: start;
    }
    .form-grid .full { grid-column: 1 / -1; }
    .form-item {
      position: relative; min-width: 0;
      display: flex; flex-direction: column; gap: 6px;
      padding-bottom: var(--form-row-space);
    }
    .form-item label { min-height: 18px; line-height: 18px; font-size: 12px; color: var(--ink-2); }
    .form-item label .req { color: var(--red-500); margin-left: 2px; }
    .form-item input, .form-item select, .form-item textarea {
      width: 100%; height: 36px; min-width: 0;
      padding: 0 10px; border: 1px solid var(--line-1); border-radius: 4px;
      font: inherit; color: var(--ink-1); background: #fff;
    }
    .form-item input:disabled, .form-item select:disabled, .form-item textarea:disabled {
      background: #f5f7fb; color: var(--ink-2); cursor: not-allowed; border-color: var(--line-2);
    }
    .form-item textarea { height: 72px; padding: 8px 10px; resize: none; }
    .form-item .err {
      position: absolute; left: 0; right: 0; bottom: 0;
      min-height: 16px; line-height: 16px;
      color: var(--red-500); font-size: 12px;
    }
    .form-tip { color: var(--ink-3); font-size: 12px; margin-top: 4px; }

    /* 工具类 */
    .muted { color: var(--ink-3); }
    .nowrap { white-space: nowrap; }
    .gap-14 { display: grid; gap: 14px; }
    .col-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }

    /* 段标题 */
    .section-title {
      display: flex; align-items: center; gap: 8px;
      font-weight: 600; margin-bottom: 10px;
    }
    .section-title .dot {
      width: 12px; height: 12px; border-radius: 3px;
      background: linear-gradient(135deg, #4d92ff, #1f6feb);
    }

    .alert-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px dashed var(--line-2); font-size: 12.5px; }
    .alert-row:last-child { border-bottom: none; }
    .alert-row .name { flex: 1; color: var(--ink-1); }
    .alert-row .meta { color: var(--ink-3); font-size: 12px; }

    /* 提示条 */
    .tip {
      background: var(--bg-tag-soft); color: var(--brand-700);
      border: 1px solid var(--brand-100);
      padding: 8px 12px; border-radius: 6px; font-size: 12px;
      display: flex; align-items: center; gap: 8px;
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- 侧栏 -->
    <aside class="sidebar">
      <div class="brand">
        <div class="logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="9" r="1.5" />
            <path d="M12 7.5V2.5" />
            <path d="M13.3 9.75l4.8 2.8" />
            <path d="M10.7 9.75l-4.8 2.8" />
            <path d="M12 10.5L10.6 21" />
            <path d="M12 10.5L13.4 21" />
            <path d="M9.7 21h4.6" />
          </svg>
        </div>
        <div class="name">海上风电建设管理平台</div>
      </div>
      <div class="side-group">
        <div class="side-item fake" aria-disabled="true" title="演示菜单">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10.5V20h13v-9.5"/><path d="M9.5 20v-6h5v6"/>
          </svg>
          <span>数字门户</span>
        </div>
        <div class="side-item fake" aria-disabled="true" title="演示菜单">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 4h11v14H4z"/><path d="M7 8h5M7 12h3"/><circle cx="17.5" cy="17.5" r="3.5"/><path d="m20 20 2 2"/>
          </svg>
          <span>项目中心</span><span class="side-caret">⌄</span>
        </div>

      lift: { page: 1, pageSize: 20, filters: {} }
    };

    function formatNow() {
      const now = new Date();
      const pad = value => String(value).padStart(2, "0");
      return `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}`;
    }
    function nextNumericId(items) {
      return items.reduce((max, item) => Math.max(max, Number(item.id) || 0), 0) + 1;
    }
    function average(values) {
      return values.length ? Math.round(values.reduce((sum, value) => sum + Number(value || 0), 0) / values.length) : 0;
    }
    function materialProgress(item) {
      if (!(Number(item.planQty) > 0)) return 0;
      const received = Math.max(0, Number(item.recvQty) || 0);
      if (received >= Number(item.planQty)) return 100;
      return Math.max(0, Math.min(99, Math.round((received / Number(item.planQty)) * 100)));
    }
    function dashboardMetrics() {
      const materialAvg = average(DATA.material.map(materialProgress));
      const pileAvg = average(DATA.piles.map(item => item.prog));
      const mainAvg = average(DATA.mains.map(item => item.prog));
      const subAvg = average(DATA.subs.map(item => item.prog));
      const liftRate = average(DATA.lifts.map(item => item.prog));
      const overall = average([materialAvg, pileAvg, mainAvg, subAvg, liftRate]);
      const recentUpdates = collectRecentUpdates(7);
      return { overall, pileAvg, mainAvg, subAvg, liftRate, recentUpdates };
    }
    function collectRecentUpdates(days) {
      const rangeEnd = new Date(`${DATA.project.today}T23:59:59`);
      const rangeStart = new Date(`${DATA.project.today}T00:00:00`);
      rangeStart.setDate(rangeStart.getDate() - (days - 1));
      const groups = [
        [DATA.material, "备料", item => item.name],
        [DATA.piles, "钢管桩", item => item.id],
        [DATA.mains, "主体构件", item => item.name],
        [DATA.subs, "附属构件", item => item.name],
        [DATA.lifts, "总装任务", item => item.name]
      ];
      return groups.flatMap(([items, type, getName]) => items.map(item => ({
        type, name: getName(item), owner: item.owner || "—", updatedAt: item.updatedAt || ""
      }))).filter(item => {
        const updatedTime = new Date(item.updatedAt.replace(" ", "T"));
        return !Number.isNaN(updatedTime.getTime()) && updatedTime >= rangeStart && updatedTime <= rangeEnd;
      })
        .sort((a, b) => b.updatedAt.localeCompare(a.updatedAt));
    }

    function barHTML(p, color="") {
      const fill = `style="width:${p}%"`;
      return `<div class="bar">
        <div class="track"><div class="fill ${color}" ${fill}></div></div>
        <div class="num">${p}%</div>
      </div>`;
    }
    function statusOf(p) {
      if (p === 0) return `<span class="status gray">未开始</span>`;
      if (p === 100) return `<span class="status green">已完成</span>`;
      return `<span class="status blue">进行中</span>`;
    }
    function statusText(p) {
      if (Number(p) === 0) return "未开始";
      if (Number(p) === 100) return "已完成";
      return "进行中";
    }
    function fmtDate(d) { return d || "—"; }
    function selected(value, expected) { return value === expected ? "selected" : ""; }
    function includesText(value, keyword) {
      return !keyword || String(value || "").toLowerCase().includes(String(keyword).toLowerCase());
    }
    function queryList(page) {
      const filters = {};
      $$("#content [data-filter]").forEach(control => { filters[control.dataset.filter] = control.value.trim(); });
      LIST_STATE[page].filters = filters;
      LIST_STATE[page].page = 1;
      render();
    }
    function resetList(page) {
      LIST_STATE[page].filters = {};
      LIST_STATE[page].page = 1;
      render();
    }
    function setPageSize(page, value) {
      LIST_STATE[page].pageSize = Number(value);
      LIST_STATE[page].page = 1;
      render();
    }
    function changePage(page, delta) {
      LIST_STATE[page].page += Number(delta);
      render();
    }
    function paginate(page, items) {
      const state = LIST_STATE[page];
      const totalPages = Math.max(1, Math.ceil(items.length / state.pageSize));
      state.page = Math.max(1, Math.min(state.page, totalPages));
      const start = (state.page - 1) * state.pageSize;
      return { rows: items.slice(start, start + state.pageSize), total: items.length, totalPages, start };
    }
    function pagerHTML(page, total, totalPages) {
      const state = LIST_STATE[page];
      return `<div class="pager">
        <span>共 ${total} 条</span>
        <select class="ctl short" aria-label="每页条数" onchange="setPageSize('${page}', this.value)" style="height:26px;min-width:auto">
          ${[10, 20, 50].map(size => `<option value="${size}" ${size===state.pageSize?'selected':''}>${size}条/页</option>`).join("")}
        </select>
        <div class="right">
          <button class="page" type="button" aria-label="上一页" onclick="changePage('${page}', -1)" ${state.page<=1?'disabled':''}>‹</button>
          <span class="page cur">${state.page} / ${totalPages}</span>
          <button class="page" type="button" aria-label="下一页" onclick="changePage('${page}', 1)" ${state.page>=totalPages?'disabled':''}>›</button>
        </div>
      </div>`;
    }
    function emptyRow(colspan) {
      return `<tr><td class="empty-cell" colspan="${colspan}">暂无符合条件的数据</td></tr>`;
    }
    function deleteListItem(page, id) {
      const config = {
        material: { key: "material", label: "备料", name: item => item.name },
        pile: { key: "piles", label: "钢管桩", name: item => item.id },
        main: { key: "mains", label: "主体构件", name: item => item.name },
        sub: { key: "subs", label: "附属构件", name: item => item.name },
        lift: { key: "lifts", label: "总装任务", name: item => item.name }
      }[page];
      const list = DATA[config.key];
      const item = list.find(row => String(row.id) === String(id));
      if (!item) return;
      if (!confirm(`确认删除${config.label}「${config.name(item)}」？刷新页面可恢复演示数据。`)) return;
      DATA[config.key] = list.filter(row => String(row.id) !== String(id));
      render();
    }

    function updateMaterialStatus() {
      const form = $("#materialForm");
      if (!form) return;
      const statusInput = form.querySelector('[name="status"]');
      if (!statusInput) return;

        planQty: form.querySelector('[name="planQty"]').value,
        recvQty: form.querySelector('[name="recvQty"]').value
      });

    function saveMaterialForm(id) {
      const form = $("#materialForm");
      const get = (n) => form.querySelector(`[name="${n}"]`).value.trim();
      const data = {
        name: get("name"),
        spec: get("spec"),
        planQty: parseFloat(get("planQty")),
        recvQty: parseFloat(get("recvQty") || "0"),
        owner: get("owner"),
        planStart: get("planStart"),
        planEnd: get("planEnd"),
        actStart: get("actStart") || null,
        actEnd: get("actEnd") || null,
        remark: form.querySelector('[name="remark"]').value.trim(),
        updatedAt: formatNow()
      };
      // 校验
      const errs = {};
      if (!data.name) errs.name = "请输入材料名称";
      if (!Number.isFinite(data.planQty) || data.planQty <= 0) errs.planQty = "计划量必须大于 0";
      if (!Number.isFinite(data.recvQty) || data.recvQty < 0) errs.recvQty = "已到货量不能为负";
      else if (Number.isFinite(data.planQty) && data.recvQty > data.planQty) errs.recvQty = "已到货量不能大于计划量";
      if (!data.owner) errs.owner = "请选择责任人";
      if (!data.planStart) errs.planStart = "请选择计划开始到货";
      if (!data.planEnd) errs.planEnd = "请选择计划完成到货";
      if (data.planStart && data.planEnd && data.planStart > data.planEnd) errs.planEnd = "计划完成不能早于计划开始";
      if (data.actEnd && !data.actStart) errs.actStart = "请先选择实际首日到货";
      if (data.actStart && data.actEnd && data.actStart > data.actEnd) errs.actEnd = "实际末日不能早于实际首日";

      form.querySelectorAll(".err").forEach(e => e.textContent = "");
      Object.keys(errs).forEach(k => {
        const el = form.querySelector(`[data-err="${k}"]`);
        if (el) el.textContent = errs[k];
      });
      if (Object.keys(errs).length) return;

      if (id != null) {
        const idx = DATA.material.findIndex(x => x.id === id);
        DATA.material[idx] = Object.assign({}, DATA.material[idx], data);
      } else {
        const newId = nextNumericId(DATA.material);
        DATA.material.push(Object.assign({ id: newId }, data));
      }
      closeModal();
      render();
    }

    function savePileForm(id) {
      const form = $("#pileForm");
      const get = (n) => form.querySelector(`[name="${n}"]`).value.trim();
      const data = {
        id: get("id"),
        spec: get("spec"),
        planStart: get("planStart"),
        planEnd: get("planEnd"),
        actStart: get("actStart") || null,
        actFinish: get("actFinish") || null,
        prog: Number(get("prog") || "0"),
        owner: get("owner"),
        updatedAt: formatNow()
      };
      const errs = {};
      if (!data.id) errs.id = "请输入编号";
      else if (!/^[A-Za-z0-9_-]+$/.test(data.id)) errs.id = "编号仅支持字母、数字、下划线和短横线";
      else if (DATA.piles.some(p => p.id === data.id && p.id !== id)) errs.id = "编号已存在";
      if (!Number.isInteger(data.prog) || data.prog < 0 || data.prog > 100) errs.prog = "制作进度必须为 0-100 的整数";
      if (!data.owner) errs.owner = "请选择责任人";
      if (!data.planStart) errs.planStart = "请选择计划开始";
      if (!data.planEnd) errs.planEnd = "请选择计划完成";
      if (data.planStart && data.planEnd && data.planStart > data.planEnd) errs.planEnd = "计划完成不能早于计划开始";
      if (data.actFinish && !data.actStart) errs.actStart = "请先选择实际开始";
      if (data.actStart && data.actFinish && data.actStart > data.actFinish) errs.actFinish = "实际完成不能早于实际开始";

      form.querySelectorAll(".err").forEach(e => e.textContent = "");
      Object.keys(errs).forEach(k => {
        const el = form.querySelector(`[data-err="${k}"]`);
        if (el) el.textContent = errs[k];
      });
      if (Object.keys(errs).length) return;

      if (id != null) {
        const idx = DATA.piles.findIndex(x => x.id === id);
        DATA.piles[idx] = Object.assign({}, DATA.piles[idx], data);
      } else {
        DATA.piles.push(Object.assign({}, data));
      }
      closeModal();
      render();
    }

    }

    function routeFromHash() {
      const path = decodeURIComponent((location.hash || "").slice(1)).split("?")[0];
      const match = path.match(/^([a-z]+)(?:@([^!]+))?(?:!(new|view|edit)(?:=(.+))?)?$/);
      if (!match || !VALID_TABS.includes(match[1])) {
        history.replaceState(null, "", "#overview");
        resetModal();
        applyTab("overview");
        return;
      }

      const [, tab, anchorId, action, actionId] = match;
      resetModal();
      applyTab(tab);
      if (tab === "overview") {
        if (action || anchorId) history.replaceState(null, "", "#overview");
        return;
      }
      if (!action && !anchorId) return;

      const collections = { material: DATA.material, pile: DATA.piles, main: DATA.mains, sub: DATA.subs, lift: DATA.lifts };
      const handlers = {
        material: { new: openMaterialForm, view: viewMaterial, edit: openMaterialForm },
        pile: { new: openPileForm, view: viewPile, edit: openPileForm },
        main: { new: openMainForm, view: viewMain, edit: openMainForm },
        sub: { new: openSubForm, view: viewSub, edit: openSubForm },
        lift: { new: openLiftForm, view: viewLift, edit: openLiftForm }
      };
      const routeAction = action || "view";
      const rawId = actionId || anchorId || (collections[tab][0] && collections[tab][0].id);
      const id = tab === "pile" ? rawId : Number(rawId);
      requestAnimationFrame(() => {
        if (routeAction === "new") handlers[tab].new();
        else if (rawId != null && handlers[tab][routeAction]) handlers[tab][routeAction](id);
      });
    }

    $$("#tabs .tab").forEach(el => el.addEventListener("click", () => goto(el.dataset.tab)));
    window.addEventListener("hashchange", routeFromHash);

    // 暴露给内联事件
    window.goto = goto;

    routeFromHash();
  </script>
</body>
</html>
